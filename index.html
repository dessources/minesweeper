<!DOCTYPE html>
<!--
  MINESWEEPER HTML

  You do NOT edit this file today. HTML is the STRUCTURE of the
  page: it creates the pieces. CSS (styles.css) styles the pieces,
  and JS (script.js) makes them react to clicks.

  Two attributes matter most for us:
    class="..."  lets CSS find an element    (CSS: .title { ... })
    id="..."     lets JS find ONE element    (JS: getElementById('board'))
-->

<!-- Tells the browser this is a modern HTML5 page.
     lang="en" says the page is in English. -->
<html lang="en">

<!-- HEAD: information ABOUT the page. Nothing in here shows up on screen
     except the title in the browser tab. -->
<head>
  <!-- Lets the page show symbols and special characters correctly -->
  <meta charset="UTF-8" />

  <!-- Makes the page fit properly on phone screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- The text shown in the browser tab -->
  <title>Minesweeper</title>

  <!-- These 3 lines load the Quicksand font from Google Fonts.
       The first two make the connection faster. The third downloads
       the font in weights 500, 600, and 700.
       The font only gets USED once we set font-family in the CSS
       (the last step in styles.css). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- THIS connects our CSS file to the page. Without this line,
       nothing you write in styles.css would do anything. -->
  <link rel="stylesheet" href="styles.css" />
</head>


<!-- BODY: everything you actually SEE on the page -->
<body>

  <!-- The white card that holds the whole game.
       <div> is a plain box with no styling. We use them to group things.
       class="game" is what CSS uses to find it: .game { ... } -->
  <div class="game">

    <!-- TOP BAR: the title on the left, the stats and button on the right.
         <header> is a div with a meaning ("the top section"). -->
    <header class="top-bar">

      <!-- <h1> is the main heading of the page -->
      <h1 class="title">Minesweeper</h1>

      <!-- Wraps the flag count, timer, and button so they can sit in
           a row together on the right side (CSS: .stats) -->
      <div class="stats">

        <!-- Flag counter.
             <span> is a small box that sits inline with text.
             The ⚑ symbol has class="icon" so CSS can color it.
             id="flags" is how JS finds the number and updates it.
             The 10 is just a starting value; JS replaces it. -->
        <div class="stat"><span class="icon">⚑</span> <span id="flags">10</span></div>

        <!-- Timer. "TIME" is a small label (class="icon-label").
             id="timer" is how JS updates the number every second. -->
        <div class="stat"><span class="icon-label">TIME</span> <span id="timer">000</span></div>

        <!-- New game button.
             <button> is a clickable element. id="new-btn" lets JS
             listen for clicks. title="New game" is the tooltip that
             appears when you hover over it. -->
        <button id="new-btn" class="new-btn" title="New game">↻</button>
      </div>
    </header>


    <!-- BOARD WRAPPER: holds the board AND the pop-up that sits on top of it.
         We need this wrapper so the pop-up can be positioned relative to
         the board (CSS: position: relative, then absolute). -->
    <div class="board-wrap">

      <!-- The board starts EMPTY. When the page loads, script.js creates
           80 <div class="cell"> squares and puts them inside it.
           CSS Grid arranges them into rows and columns. -->
      <div id="board" class="board"></div>

      <!-- POP-UP BOX: the "click to start", "game over", and "you win"
           message. It sits on top of the board.
           JS fills in the symbol and message, and adds or removes the
           class "hidden" to show or hide it. -->
      <div id="overlay" class="overlay">

        <!-- The big symbol (▶ at the start, ✕ on lose, ★ on win) -->
        <div id="overlay-icons" class="overlay-icons">▶</div>

        <!-- <p> is a paragraph. Empty at first. JS fills in the message. -->
        <p id="overlay-text"></p>
      </div>
    </div>

  </div>


  <!-- Loads the game logic. This goes at the BOTTOM of the body on
       purpose: the JS needs the HTML elements above to already exist
       before it tries to find them with getElementById. -->
  <script src="script.js"></script>
</body>
</html>
